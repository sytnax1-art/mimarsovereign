<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MimarSovereign demo">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030712" />
  <g transform="translate(640,360)">
    <g id="rings" fill="none" stroke="url(#g)" stroke-opacity="0.9">
      <circle r="180" stroke-width="1"/>
      <circle r="240" stroke-width="1"/>
      <circle r="300" stroke-width="1"/>
    </g>
    <circle r="48" fill="#e2e8f0">
      <animate attributeName="r" values="44;52;44" dur="3s" repeatCount="indefinite" />
    </circle>
    <g id="sat" fill="#f472b6">
      <circle cx="-220" cy="0" r="10">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <g transform="translate(80,60)">
    <text x="0" y="0" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" fill="#67e8f9">MimarSovereign v8.0</text>
    <text x="0" y="36" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" fill="#a5b4cf">Space‑age demo • Interactive landing (Awaken / Calibrate / Manifest)</text>
  </g>
</svg>
